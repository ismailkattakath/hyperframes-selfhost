name: Bug report
description: Something is broken in install, Funnel, OAuth, or the stack
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste secrets** (auth keys, client secrets, tokens).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Exact steps (install flags, OS, Docker version)
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: "e.g. Docker Desktop linux/arm64, Ubuntu 24.04 aarch64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: `docker compose logs` with secrets redacted
      render: shell
