# Nightly regression of static gates (catch bitrot / Dependabot lag).
name: nightly

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: nightly-static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck + Hadolint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -sL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64"
          sudo install -m 0755 /tmp/hadolint /usr/local/bin/hadolint
      - name: Static suite
        run: |
          chmod +x scripts/*.sh install.sh image/entrypoint.sh
          ./scripts/ci-static.sh
