# Required on PRs to main — static gates only (no live Tailscale/Google).
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck + Hadolint
        env:
          # Content-pin the release asset — bump BOTH together. The sha256 is the
          # one published as hadolint-Linux-x86_64.sha256 in the same release.
          HADOLINT_VERSION: v2.12.0
          HADOLINT_SHA256: 56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # Not hadolint/hadolint-action: the one release that digest-pins its own
          # hadolint image (v3.5.0, 06be81b) ships 2.15.1, whose DL3066 fails this
          # Dockerfile on `USER app` (so does v3.4.0/2.15.0); the releases that lint
          # clean (v3.1.0, v3.3.0) pull their image by mutable tag. Hash the binary.
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o /tmp/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          echo "${HADOLINT_SHA256}  /tmp/hadolint" | sha256sum -c -
          install -m 0755 /tmp/hadolint "$HOME/.local/bin/hadolint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Seed dummy .env + compose config
        run: |
          chmod +x scripts/*.sh install.sh image/entrypoint.sh
          ./scripts/ci-seed-env.sh
          docker compose config -q

      - name: Repo hygiene
        run: |
          test -f .env.example
          test -f LICENSE
          test -f SECURITY.md
          test -f CONTRIBUTING.md
          grep -qE '^\.env' .gitignore
          test -f terraform/config.tf.json
          test ! -f terraform/main.tf
          python3 -c 'import json; json.load(open("terraform/config.tf.json"))'

      - name: ShellCheck
        run: shellcheck -x install.sh scripts/*.sh image/entrypoint.sh

      - name: Hadolint Dockerfile
        run: |
          # DL3008: apt versions float on slim bases; we pin app layers explicitly.
          hadolint --ignore DL3008 --ignore DL3015 image/Dockerfile

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: trivy-fs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
